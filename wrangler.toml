# Cloudflare Worker deployment config. See README.md "Deploy to your own Cloudflare account".
name = "kabira-international-school"
account_id = "9f9d51d09fbff0ce63382a46212fc8f1"
main = "worker/index.js"
compatibility_date = "2024-11-01"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "kabira-admissions"
database_id = "8ad4f8b1-44b9-4731-9667-de2c98832bb9"

# A generous IP ceiling complements the stricter, persistent per-phone limit.
# Shared mobile-network IPs can still accommodate multiple families.
[[ratelimits]]
name = "ADMISSIONS_RATE_LIMITER"
namespace_id = "43002026"
simple = { limit = 30, period = 60 }
